name: Tests

on:
  push:
    branches:
      - main
      - lab1
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore AutoServiceLab.slnx

      - name: Build
        run: dotnet build AutoServiceLab.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AutoServiceLab.slnx --no-build --configuration Release --verbosity normal