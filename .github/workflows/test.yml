name: Tests

on:
  push:
    branches:
      - lab3
  pull_request:
    branches:
      - main

env:
  ASPIRE_ALLOW_UNSECURED_TRANSPORT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VetClinic.slnx

      - name: Build
        run: dotnet build VetClinic.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet run --project ./VetClinic.Tests/VetClinic.Tests.csproj --no-build -c Release
