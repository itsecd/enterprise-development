name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test BeautySalon
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore test project
        run: |
          dotnet restore BeautySalon.slnx

      - name: Build test project
        run: |
          dotnet build BeautySalon.slnx \
            --configuration Release \
            --no-restore

      - name: Run tests
        run: |
          dotnet test BeautySalon.slnx \
            --configuration Release \
            --no-build