name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore FoodDelivery/FoodDelivery.slnx

      - name: Build project
        run: dotnet build FoodDelivery/FoodDelivery.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FoodDelivery/FoodDelivery.slnx --no-build --configuration Release --verbosity normal